<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Case Ivoirienne - Menu digital</title>
    <meta
      name="description"
      content="Menu digital de La Case Ivoirienne: plats ivoiriens, entrées, grillades, desserts et boissons."
    />
    <meta name="theme-color" content="#167a3a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/logocaseivoirienne.jpeg">
    <link rel="apple-touch-icon" href="assets/logocaseivoirienne.jpeg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero" id="accueil">
      <nav class="topbar" aria-label="Navigation principale">
        <a class="brand" href="#accueil" aria-label="Accueil La Case Ivoirienne">
          <span class="brand-mark">
            <img src="assets/logocaseivoirienne.jpeg" alt="" />
          </span>
          <span>La Case<br />Ivoirienne</span>
        </a>
        <button class="icon-button menu-toggle" type="button" id="menuToggle" aria-label="Ouvrir les catégories" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="burger-menu" id="burgerMenu" aria-label="Catégories"></div>
      </nav>

      <div class="hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">Cuisine ivoirienne</p>
          <h1>La Case Ivoirienne</h1>
          <p class="intro">
            Saveurs ivoiriennes, assiettes généreuses et service rapide directement depuis votre table.
          </p>
          <div class="hero-actions">
            <a class="primary-action" href="#menu">Voir le menu</a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="menu-shell" id="menu" aria-labelledby="menuTitle">
        <div class="menu-heading">
          <div>
            <p class="eyebrow">Notre carte</p>
            <h2 id="menuTitle">Menu</h2>
          </div>
          <div class="flag-strip" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="category-tabs" id="categoryTabs" aria-label="Catégories du menu"></div>
        <div class="menu-list" id="menuList"></div>
      </section>
    </main>

    <footer class="footer" id="contact">
      <div class="footer-brand">
        <img src="assets/logocaseivoirienne.jpeg" alt="Logo La Case Ivoirienne" />
        <div>
          <strong>La Case Ivoirienne</strong>
          <span>Cuisine ivoirienne authentique</span>
        </div>
      </div>

      <address class="footer-contact">
        <span>Lieu : Dakar, Sénégal</span>
        <a href="tel:+221781174095">Tél : +221 78 117 40 95</a>
      </address>

      <div class="footer-social" aria-label="Réseaux sociaux">
        <a href="https://www.tiktok.com/@lacaseivoirienne?_r=1&_t=ZS-9ANmY05XjhY" target="_blank" rel="noopener noreferrer" aria-label="TikTok La Case Ivoirienne">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 4c.4 3 2.2 4.8 5 5v4c-1.8 0-3.5-.6-5-1.7V16a5 5 0 1 1-5-5c.4 0 .7 0 1 .1v4.2A1.9 1.9 0 1 0 12 17V4h2Z" />
          </svg>
          <span class="sr-only">TikTok</span>
        </a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
