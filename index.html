<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Case Ivoirienne - Menu digital</title>
    <meta
      name="description"
      content="Menu digital de La Case Ivoirienne: plats ivoiriens, entrées, grillades, desserts et boissons."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero" id="accueil">
      <nav class="topbar" aria-label="Navigation principale">
        <a class="brand" href="#accueil" aria-label="Accueil La Case Ivoirienne">
          <span class="brand-mark">
            <img src="assets/logocaseivoirienne.jpeg" alt="" />
          </span>
          <span>La Case<br />Ivoirienne</span>
        </a>
        <a class="icon-button" href="#menu" aria-label="Voir le menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </a>
      </nav>

      <div class="hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">Menu QR Code</p>
          <h1>La Case Ivoirienne</h1>
          <p class="intro">
            Saveurs ivoiriennes, assiettes généreuses et service rapide directement depuis votre table.
          </p>
          <div class="hero-actions">
            <a class="primary-action" href="#menu">Voir le menu</a>
            <button class="secondary-action" type="button" id="openQr">QR Code</button>
          </div>
        </div>

        <div class="flyer-preview" aria-label="Inspiration visuelle du menu">
          <img src="assets/food-menu-flyer.jpeg" alt="Menu illustré avec plats et prix" />
        </div>
      </div>
    </header>

    <main>
      <section class="menu-shell" id="menu" aria-labelledby="menuTitle">
        <div class="menu-heading">
          <div>
            <p class="eyebrow">Notre carte</p>
            <h2 id="menuTitle">Menu du jour</h2>
          </div>
          <div class="flag-strip" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="search-row">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m16.5 16.5 4 4" />
            </svg>
            <input id="searchInput" type="search" placeholder="Rechercher un plat" autocomplete="off" />
          </label>
        </div>

        <div class="category-tabs" id="categoryTabs" aria-label="Catégories du menu"></div>
        <div class="menu-list" id="menuList"></div>
      </section>
    </main>

    <footer class="footer">
      <div>
        <strong>La Case Ivoirienne</strong>
        <span>Cuisine ivoirienne - Dakar</span>
      </div>
      <a href="tel:+221770000000">+221 77 000 00 00</a>
    </footer>

    <dialog class="qr-dialog" id="qrDialog" aria-labelledby="qrTitle">
      <div class="dialog-head">
        <h2 id="qrTitle">QR Code du menu</h2>
        <button class="icon-button close-dialog" type="button" id="closeQr" aria-label="Fermer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <img id="qrImage" alt="QR Code du menu digital" />
      <p class="qr-url" id="qrUrl"></p>
      <button class="primary-action print-action" type="button" id="printQr">Imprimer</button>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
